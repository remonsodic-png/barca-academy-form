<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barça Academy | Registration Form</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family: 'Arial Black', Arial, sans-serif;
    background: linear-gradient(160deg, #1a3a8f 0%, #2a1a6e 35%, #8a0a3a 65%, #6a0a2a 100%);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:0;
  }

  .page {
    width:100%;
    max-width:700px;
    background: linear-gradient(160deg, #1a3a8f 0%, #2a1a6e 35%, #8a0a3a 65%, #6a0a2a 100%);
    min-height:100vh;
    padding:30px 40px 50px;
  }

  .brand {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:20px;
    padding-top:10px;
  }
  .brand img { height:70px; width:auto; }
  .brand .wordmark { color:#fff; line-height:1.1; }
  .brand .wordmark b { font-size:30px; font-weight:900; display:block; letter-spacing:1px; }
  .brand .wordmark span { font-size:24px; font-weight:300; display:block; }

  h1.title {
    text-align:center;
    color:#fff;
    font-size:14px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:28px;
  }

  .field {
    background:#fff;
    margin-bottom:6px;
    padding:10px 14px 12px;
    min-height:52px;
  }

  .field.tall { min-height:160px; padding-bottom:0; }

  .field label {
    display:block;
    font-size:13px;
    font-weight:900;
    color:#111;
    margin-bottom:2px;
  }

  .field input,
  .field textarea {
    width:100%;
    border:none;
    outline:none;
    font-size:14px;
    font-family:inherit;
    color:#111;
    background:transparent;
    padding:4px 0 2px;
    resize:none;
  }

  .field.tall textarea {
    height:130px;
    display:block;
  }

  button.submit {
    width:100%;
    margin-top:8px;
    padding:15px;
    border:none;
    background:#c8a84b;
    color:#fff;
    font-weight:900;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
  }
  button.submit:hover { background:#b8983b; }
  button.submit:disabled { opacity:0.6; cursor:default; }

  .status {
    text-align:center;
    color:#fff;
    font-size:13px;
    min-height:18px;
    margin-top:8px;
  }
  .status.error { color:#ffd3d3; }
  .status.ok { color:#d6ffe0; font-weight:700; }

  @media (max-width:500px) {
    .page { padding:20px 16px 40px; }
    .brand img { height:55px; }
    .brand .wordmark b { font-size:24px; }
    .brand .wordmark span { font-size:18px; }
  }
</style>
</head>

  <h1 class="title">Registration Form</h1>

  <form id="regForm">
    <div class="field">
      <label>Name and surname:</label>
      <input type="text" name="Name and surname" required>
    </div>

    <div class="field">
      <label>Birth year:</label>
      <input type="text" name="Birth year" required>
    </div>

    <div class="field">
      <label>Size:</label>
      <input type="text" name="Size" required>
    </div>

    <div class="field">
      <label>Contact telephone:</label>
      <input type="tel" name="Contact telephone" required>
    </div>

    <div class="field">
      <label>E-mail:</label>
      <input type="email" name="E-mail" required>
    </div>

    <div class="field tall">
      <label>Observations:</label>
      <textarea name="Observations"></textarea>
    </div>

    <div class="field tall">
      <label>Image rights:</label>
      <textarea name="Image rights"></textarea>
    </div>

    <button type="submit" class="submit" id="submitBtn">Send registration</button>
    <div class="status" id="statusMsg"></div>
  </form>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznuO4nCAxm6jEAxWaoEATvP-6HpVZzyGT8vUVssUYYR5JRHTBRwzCkV7zhRAzbi0AzPg/exec";
  const form = document.getElementById('regForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    statusMsg.textContent = '';
    statusMsg.className = 'status';

    const data = new FormData(form);

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: data
    })
    .then(function() {
      statusMsg.textContent = 'Registration sent successfully. Thank you!';
      statusMsg.className = 'status ok';
      form.reset();
    })
    .catch(function() {
      statusMsg.textContent = 'Something went wrong. Please try again.';
      statusMsg.className = 'status error';
    })
    .finally(function() {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send registration';
    });
  });
</script>
